    <script>
      (function() {
        // Intercept console.error to suppress Vite HMR disconnect logs in iframe sandbox
        var origConsoleError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            text += ' ' + (arg && arg.stack ? arg.stack : String(arg || ''));
          }
          if (
            text.indexOf('WebSocket') !== -1 ||
            text.indexOf('websocket') !== -1 ||
            text.indexOf('[vite]') !== -1 ||
            text.indexOf('@vite/client') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // Neutralize Vite HMR WebSocket in sandbox iframe environment
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))) {
              var target = new EventTarget();
              var dummy = {
                readyState: 1, // OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  return target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  return target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                }
              };
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch(e) {}
              }, 10);
              return dummy;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CONNECTING = 0;
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + (error && error.stack ? error.stack : '');
          if (
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('[vite]') !== -1
          ) {
            return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason.stack || e.reason.message || e.reason) : '';
          if (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('vite') !== -1 ||
            reason.indexOf('@vite/client') !== -1
          ) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(e) {
          var file = String(e.filename || '');
          var msg = String(e.message || '');
          if (
            file.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
