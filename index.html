    <script>
      // Ignore WebSocket / HMR disconnect errors in sandbox environment
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (
          String(e.reason).includes('WebSocket') || 
          String(e.reason.message || '').includes('WebSocket') ||
          String(e.reason).includes('vite')
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && (
          e.message.includes('WebSocket') || 
          e.message.includes('@vite/client')
        )) {
          e.preventDefault();
        }
      });
    </script>
