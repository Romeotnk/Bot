<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#191c2b" />
      <stop offset="100%" stop-color="#06070c" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e7b8" />
      <stop offset="50%" stop-color="#e8c56a" />
      <stop offset="100%" stop-color="#9a7b2c" />
    </linearGradient>
    <linearGradient id="ice-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fd6ff" />
      <stop offset="100%" stop-color="#e8c56a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#232637" stroke-width="3" />

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#e8c56a" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7fd6ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="60 30" />
  
  <!-- Precision HUD Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="90" stroke="#e8c56a" stroke-width="2" stroke-opacity="0.7" />
  <line x1="256" y1="422" x2="256" y2="472" stroke="#e8c56a" stroke-width="2" stroke-opacity="0.7" />
  <line x1="40" y1="256" x2="90" y2="256" stroke="#e8c56a" stroke-width="2" stroke-opacity="0.7" />
  <line x1="422" y1="256" x2="472" y2="256" stroke="#e8c56a" stroke-width="2" stroke-opacity="0.7" />

  <!-- Core Aurum Rhombus / Torus -->
  <g filter="url(#glow)">
    <!-- Concentric Aurum Orbitals -->
    <ellipse cx="256" cy="256" rx="120" ry="46" fill="none" stroke="url(#gold-grad)" stroke-width="4" transform="rotate(-30 256 256)" />
    <ellipse cx="256" cy="256" rx="120" ry="46" fill="none" stroke="url(#ice-grad)" stroke-width="3" stroke-dasharray="14 8" transform="rotate(30 256 256)" opacity="0.85" />
    <ellipse cx="256" cy="256" rx="120" ry="46" fill="none" stroke="#f6e7b8" stroke-width="2" transform="rotate(90 256 256)" opacity="0.6" />

    <!-- Central Glowing Core Sphere -->
    <circle cx="256" cy="256" r="38" fill="url(#gold-grad)" />
    <circle cx="256" cy="256" r="24" fill="#ffffff" opacity="0.85" />
    <circle cx="256" cy="256" r="12" fill="#7fd6ff" />
  </g>

  <!-- Stylized 'V' Chevron in Golden Accent -->
  <path d="M 226 210 L 256 280 L 286 210" fill="none" stroke="#06070c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
